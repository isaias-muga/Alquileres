version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "teW3EQ2uRR7k7F[fq__"
      MYSQL_DATABASE: "mysqlroot3"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: .
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mysqlroot3
      - DB_USER=root
      - DB_PASSWORD=teW3EQ2uRR7k7F[fq__
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
